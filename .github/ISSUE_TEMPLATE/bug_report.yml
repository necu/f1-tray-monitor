name: Reporte de error
description: Algo no funciona como debería
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un problema. Antes de continuar,
        busca en los issues existentes por si ya está reportado.

  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: ¿Qué ocurre y qué esperabas que ocurriera?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir el monitor con...
        2. Pulsar en...
        3. Ver el error...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión del proyecto
      description: Aparece en el historial de versiones o en el nombre del ZIP.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Navegador del reproductor
      options:
        - Opera (recomendado)
        - Navegador predeterminado
        - No aplica
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Registro y capturas
      description: |
        Pega las últimas líneas de `monitor.log` y, si aplica, una captura.
        Elimina cualquier dato personal antes de publicarlo.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: He buscado issues duplicados.
          required: true
        - label: He revisado que no sea un problema del sitio web de terceros.
          required: true
